server {
    listen 80;
    listen 8080;
    listen 3000;
    server_name _;

    charset utf-8;
    client_max_body_size 64M;

    root /var/www/html/web;
    index index.php index.html;

    # ── 1. API & Backend Requests (High Precedence ^~) ─────────────────────
    location ^~ /api/ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/web/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_buffer_size 32k;
        fastcgi_buffers     8 16k;
        fastcgi_read_timeout 120s;
        fastcgi_connect_timeout 60s;
    }

    # ── 2. Direct PHP Scripts (ping.php, index.php) ────────────────────────
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/web$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_buffer_size 32k;
        fastcgi_buffers     8 16k;
        fastcgi_read_timeout 120s;
        fastcgi_connect_timeout 60s;
    }

    # ── 3. Static Assets (JS, CSS, Images, Fonts) ──────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json)$ {
        root /var/www/html/frontend/dist;
        try_files $uri =404;
    }

    # ── 4. React SPA Fallback ──────────────────────────────────────────────
    location / {
        root /var/www/html/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }
}
