server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 64M;

    root /var/www/html/web;
    index index.php index.html;

    # ── Static React SPA assets ──────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json)$ {
        root /var/www/html/frontend/dist;
        try_files $uri =404;
    }

    # ── API & Yii2 Routing ──────────────────────────────────────────────────
    location /api/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/(index\.php|assets|gii|debug) {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ── PHP-FPM Processor ────────────────────────────────────────────────────
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/web/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_buffer_size 32k;
        fastcgi_buffers     8 16k;
    }

    # ── React SPA Fallback (must be last) ────────────────────────────────────
    location / {
        root /var/www/html/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }
}
