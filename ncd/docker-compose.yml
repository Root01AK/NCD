version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_NAME=ncd
      - DB_USER=root
      - DB_PASSWORD=Kirub@2001
      - YII_ENV=prod
      - YII_DEBUG=false
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=Kirub@2001
      - MYSQL_DATABASE=ncd
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./DB/ncd.sql:/docker-entrypoint-initdb.d/ncd.sql:ro
    ports:
      - "3306:3306"

volumes:
  mariadb_data:
