services:
  app:
    build:
      context: ./ncd
      dockerfile: Dockerfile
    image: ncd-app:latest
    expose:
      - "80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-ncd}
      - DB_USER=${DB_USER:-ncd_user}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - YII_ENV=prod
      - YII_DEBUG=false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ncd_net

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootchangeme}
      - MYSQL_DATABASE=${DB_NAME:-ncd}
      - MYSQL_USER=${DB_USER:-ncd_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./ncd/DB/ncd.sql:/docker-entrypoint-initdb.d/01-ncd.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ncd_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ncd_net

volumes:
  mariadb_data:

networks:
  ncd_net:
    driver: bridge
