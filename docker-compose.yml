services:
  app:
    build:
      context: ./ncd
      dockerfile: Dockerfile
    image: ncd-app:latest
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-ncd}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-Kirub@2001}
      - YII_ENV=prod
      - YII_DEBUG=false
    depends_on:
      - db
    restart: always
    networks:
      - ncd_net

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-Kirub@2001}
      - MYSQL_DATABASE=${DB_NAME:-ncd}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - ncd_net

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8088:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Kirub@2001}
    depends_on:
      - db
    networks:
      - ncd_net

volumes:
  mariadb_data:
    name: ncd_mariadb_persistent_data

networks:
  ncd_net:
    driver: bridge
